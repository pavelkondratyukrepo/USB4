<svg width="1200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" class="fig-svg seq" role="img" aria-label="Normal USB-C dock bring-up sequence, ten stages"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
.t{font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;fill:#e9f0e6;font-size:12px;letter-spacing:.02em}
.th{font-family:'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:700;font-stretch:78%;letter-spacing:.03em;fill:#e9f0e6}
.ts{font-size:10px}.tm{font-size:14px}.tl{font-size:17px}.txl{font-size:24px}.txxl{font-size:36px}.tw{font-weight:700}
.mid{text-anchor:middle}.end{text-anchor:end}
.c-dim{fill:#97ad9f}.c-mute{fill:#62796b}.c-pwr{fill:#3ddc84}.c-aux{fill:#f2c230}.c-main{fill:#4ea2ff}
.c-io{fill:#b07cff}.c-fail{fill:#ff4f4f}.c-off{fill:#7f8f86}.c-warn{fill:#ff9f1a}.c-ink{fill:#d5e1d8}.c-bg{fill:#06100b}
.tr{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pad{fill:#d8b66c}.pkg{fill:#111416;stroke:#2b3236;stroke-width:1}.pkg-top{fill:#1a1e21}
.pin1{fill:#3a4247}.ic-l{font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;font-size:11px;font-weight:700;fill:#e9f0e6}
.ic-s{font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;font-size:8.5px;fill:#97ad9f}
.silk{fill:none;stroke:#e9f0e6;stroke-opacity:.55;stroke-width:1}
.box{fill:#0c1b14;stroke:#24402f;stroke-width:1.2}
.box2{fill:#0f241a;stroke:#2c5541;stroke-width:1.2}
.hit{cursor:pointer}.hit:hover .pkg-top,.hit:focus .pkg-top{fill:#26313a}
.hit:focus{outline:none}.hit:focus-visible .ring{stroke:#fff;stroke-width:2.5;opacity:1}
.flow{stroke-dasharray:3 13;animation:flow 1.1s linear infinite}
.flow-slow{stroke-dasharray:3 13;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.boot{animation:bootOn .9s ease-out both}
@keyframes bootOn{from{stroke:#56645c;opacity:.35}}
.fade-in{animation:fadeIn .5s ease-out both}
@keyframes fadeIn{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.flow,.flow-slow,.pulse,.boot,.fade-in{animation:none}}
</style><defs>
<filter id="glow" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="9000" height="9000"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowBig" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="9000" height="9000"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".55"/></filter>
<pattern id="pcbTex" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#0a2216"/><path d="M0 12H24M12 0V24" stroke="#0e2c1c" stroke-width=".6"/><circle cx="12" cy="12" r=".9" fill="#174a30"/></pattern>
<pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(255,79,79,.10)"/><line x1="0" y1="0" x2="0" y2="8" stroke="#ff4f4f" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="hatchGray" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#56645c" stroke-width="1.5" stroke-opacity=".6"/></pattern>
<pattern id="hatchYel" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#f2c230" stroke-width="1.5" stroke-opacity=".5"/></pattern>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd6da"/><stop offset=".5" stop-color="#8b959b"/><stop offset="1" stop-color="#5d666b"/></linearGradient>
<linearGradient id="cell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3a33"/><stop offset="1" stop-color="#18211c"/></linearGradient>
<linearGradient id="die" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a6670"/><stop offset=".45" stop-color="#2f363c"/><stop offset="1" stop-color="#4a545c"/></linearGradient>
<marker id="ar-dp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#46d7e6"/></marker><marker id="ar-pwr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc84"/></marker><marker id="ar-aux" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2c230"/></marker><marker id="ar-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ea2ff"/></marker><marker id="ar-io" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07cff"/></marker><marker id="ar-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff4f4f"/></marker><marker id="ar-off" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56645c"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e1d8"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f1a"/></marker><marker id="ar-sig" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d6cc"/></marker>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 2 4 14h6.5L9 22l11-13.5h-7z" fill="currentColor"/></symbol>
<symbol id="i-usb" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V4"/><path d="M9 6.5 12 2l3 4.5z" fill="currentColor"/><path d="M12 15 6.5 11.5V8.5"/><circle cx="6.5" cy="7" r="1.6" fill="currentColor"/><path d="M12 18l5.5-3.5V11"/><rect x="15.8" y="8" width="3.4" height="3.4" fill="currentColor"/><circle cx="12" cy="20.5" r="1.8" fill="currentColor"/></g></symbol>
<symbol id="i-mon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="3.5" width="19" height="13" rx="1.5"/><path d="M8.5 20.5h7M12 16.5v4" stroke-linecap="round"/></g></symbol>
<symbol id="i-net" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7h16v11H4z"/><path d="M8 18v-4h8v4M9 7V4h6v3"/></g></symbol>
<symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7 12.5 3.2 3.2L17 9" fill="none" stroke="#06100b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m8 8 8 8M16 8l-8 8" stroke="#06100b" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 2.5 22.5 21h-21z" fill="currentColor"/><path d="M12 9v5.5" stroke="#06100b" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.4" fill="#06100b"/></symbol>
<symbol id="i-q" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M9.2 9.3a2.9 2.9 0 1 1 3.9 2.7c-.8.3-1.1.9-1.1 1.7v.5" fill="none" stroke="#06100b" stroke-width="2.3" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.3" fill="#06100b"/></symbol>
<symbol id="i-btn" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M7.2 6.2a7.5 7.5 0 1 0 9.6 0"/></g></symbol>
</defs><rect width="100%" height="100%" fill="#06100b"/><text x="40" y="50" class="th txl">NORMAL USB-C DOCK BRING-UP</text><text x="40" y="72" class="t ts c-dim">Representative order · USB 2.0 can enumerate as soon as VBUS is up; DP and USB 3 wait for Alt Mode</text><g transform="translate(0,40)"><path d="M150,150 H1050 C1130,150 1130,330 1050,330 H150" fill="none" stroke="#1d3428" stroke-width="10" stroke-linecap="round"></path><path d="M150,150 L375,150" class="tr seq-link" data-step="1" stroke="#3ddc84" stroke-width="3" filter="url(#glow)"></path><path d="M375,150 L600,150" class="tr seq-link" data-step="2" stroke="#3ddc84" stroke-width="3" filter="url(#glow)"></path><path d="M600,150 L825,150" class="tr seq-link" data-step="3" stroke="#3ddc84" stroke-width="3" filter="url(#glow)"></path><path d="M825,150 L1050,150" class="tr seq-link" data-step="4" stroke="#3ddc84" stroke-width="3" filter="url(#glow)"></path><path d="M1050,150 C1130,150 1130,330 1050,330" class="tr seq-link" data-step="5" stroke="#b07cff" stroke-width="3" filter="url(#glow)"></path><path d="M1050,330 L825,330" class="tr seq-link" data-step="6" stroke="#b07cff" stroke-width="3" filter="url(#glow)"></path><path d="M825,330 L600,330" class="tr seq-link" data-step="7" stroke="#b07cff" stroke-width="3" filter="url(#glow)"></path><path d="M600,330 L375,330" class="tr seq-link" data-step="8" stroke="#46d7e6" stroke-width="3" filter="url(#glow)"></path><path d="M375,330 L150,330" class="tr seq-link" data-step="9" stroke="#4ea2ff" stroke-width="3" filter="url(#glow)"></path><g class="seq-node" data-step="0"><circle cx="150" cy="150" r="27" fill="#06100b" stroke="#d5e1d8" stroke-width="3" filter="url(#glow)"></circle><text x="150" y="158" class="th mid tl" style="fill:#d5e1d8;font-size:22px">1</text><text x="150" y="106" class="th mid" style="font-size:15px;fill:#e9f0e6">CABLE INSERTED</text><text x="150" y="122" class="t mid" style="font-size:9px;fill:#97ad9f">plug mates · orientation unknown</text></g><g class="seq-node" data-step="1"><circle cx="375" cy="150" r="27" fill="#06100b" stroke="#3ddc84" stroke-width="3" filter="url(#glow)"></circle><text x="375" y="158" class="th mid tl" style="fill:#3ddc84;font-size:22px">2</text><text x="375" y="106" class="th mid" style="font-size:15px;fill:#e9f0e6">CC ATTACH</text><text x="375" y="122" class="t mid" style="font-size:9px;fill:#97ad9f">Rp/Rd seen on CC1 or CC2 → flip known</text></g><g class="seq-node" data-step="2"><circle cx="600" cy="150" r="27" fill="#06100b" stroke="#3ddc84" stroke-width="3" filter="url(#glow)"></circle><text x="600" y="158" class="th mid tl" style="fill:#3ddc84;font-size:22px">3</text><text x="600" y="106" class="th mid" style="font-size:15px;fill:#e9f0e6">PD NEGOTIATION</text><text x="600" y="122" class="t mid" style="font-size:9px;fill:#97ad9f">Source_Caps → Request → Accept → PS_RDY</text></g><g class="seq-node" data-step="3"><circle cx="825" cy="150" r="27" fill="#06100b" stroke="#3ddc84" stroke-width="3" filter="url(#glow)"></circle><text x="825" y="158" class="th mid tl" style="fill:#3ddc84;font-size:22px">4</text><text x="825" y="106" class="th mid" style="font-size:15px;fill:#e9f0e6">VBUS ESTABLISHED</text><text x="825" y="122" class="t mid" style="font-size:9px;fill:#97ad9f">contract voltage, e.g. 20 V</text></g><g class="seq-node" data-step="4"><circle cx="1050" cy="150" r="27" fill="#06100b" stroke="#3ddc84" stroke-width="3" filter="url(#glow)"></circle><text x="1050" y="158" class="th mid tl" style="fill:#3ddc84;font-size:22px">5</text><text x="1050" y="106" class="th mid" style="font-size:15px;fill:#e9f0e6">CHARGING</text><text x="1050" y="122" class="t mid" style="font-size:9px;fill:#97ad9f">charger takes VBUS → VSYS + battery</text></g><g class="seq-node" data-step="5"><circle cx="1050" cy="330" r="27" fill="#06100b" stroke="#b07cff" stroke-width="3" filter="url(#glow)"></circle><text x="1050" y="338" class="th mid tl" style="fill:#b07cff;font-size:22px">6</text><text x="1050" y="382" class="th mid" style="font-size:15px;fill:#e9f0e6">DP ALT MODE</text><text x="1050" y="398" class="t mid" style="font-size:9px;fill:#97ad9f">Discover ID/SVIDs/Modes → Enter Mode</text></g><g class="seq-node" data-step="6"><circle cx="825" cy="330" r="27" fill="#06100b" stroke="#b07cff" stroke-width="3" filter="url(#glow)"></circle><text x="825" y="338" class="th mid tl" style="fill:#b07cff;font-size:22px">7</text><text x="825" y="382" class="th mid" style="font-size:15px;fill:#e9f0e6">MUX ROUTES LANES</text><text x="825" y="398" class="t mid" style="font-size:9px;fill:#97ad9f">pin assignment C or D · orientation</text></g><g class="seq-node" data-step="7"><circle cx="600" cy="330" r="27" fill="#06100b" stroke="#b07cff" stroke-width="3" filter="url(#glow)"></circle><text x="600" y="338" class="th mid tl" style="fill:#b07cff;font-size:22px">8</text><text x="600" y="382" class="th mid" style="font-size:15px;fill:#e9f0e6">USB HUB ENUMERATES</text><text x="600" y="398" class="t mid" style="font-size:9px;fill:#97ad9f">dock hub, NIC, audio, ports</text></g><g class="seq-node" data-step="8"><circle cx="375" cy="330" r="27" fill="#06100b" stroke="#46d7e6" stroke-width="3" filter="url(#glow)"></circle><text x="375" y="338" class="th mid tl" style="fill:#46d7e6;font-size:22px">9</text><text x="375" y="382" class="th mid" style="font-size:15px;fill:#e9f0e6">DP LINK TRAINS</text><text x="375" y="398" class="t mid" style="font-size:9px;fill:#97ad9f">AUX over SBU · clock recovery · EQ</text></g><g class="seq-node" data-step="9"><circle cx="150" cy="330" r="27" fill="#06100b" stroke="#4ea2ff" stroke-width="3" filter="url(#glow)"></circle><text x="150" y="338" class="th mid tl" style="fill:#4ea2ff;font-size:22px">10</text><text x="150" y="382" class="th mid" style="font-size:15px;fill:#e9f0e6">WINDOWS ENUMERATES</text><text x="150" y="398" class="t mid" style="font-size:9px;fill:#97ad9f">PnP: displays, Ethernet, USB devices</text></g></g><rect x="40" y="470" width="330" height="6" rx="3" fill="#3ddc84"></rect><text x="40" y="496" class="t ts tw" style="fill:#3ddc84">POWER DOMAIN · stages 1–5</text><rect x="400" y="470" width="380" height="6" rx="3" fill="#b07cff"></rect><text x="400" y="496" class="t ts tw" style="fill:#b07cff">DATA / ALT MODE · 6–8</text><rect x="810" y="470" width="160" height="6" rx="3" fill="#46d7e6"></rect><text x="810" y="496" class="t ts tw" style="fill:#46d7e6">DISPLAY · 9</text><rect x="1000" y="470" width="160" height="6" rx="3" fill="#4ea2ff"></rect><text x="1000" y="496" class="t ts tw" style="fill:#4ea2ff">OS · 10</text><g transform="translate(330,520)"><rect width="170" height="34" rx="17" fill="#06100b" stroke="#3ddc84" stroke-width="1.6"></rect><use href="#i-bolt" x="10" y="7" width="20" height="20" style="color:#d5e1d8"></use><text x="38" y="22" class="t tm tw">CHARGING</text><use href="#i-ok" x="140" y="7" width="20" height="20" style="color:#3ddc84"></use></g><g transform="translate(515,520)"><rect width="150" height="34" rx="17" fill="#06100b" stroke="#3ddc84" stroke-width="1.6"></rect><use href="#i-usb" x="10" y="7" width="20" height="20" style="color:#d5e1d8"></use><text x="38" y="22" class="t tm tw">USB</text><use href="#i-ok" x="120" y="7" width="20" height="20" style="color:#3ddc84"></use></g><g transform="translate(680,520)"><rect width="170" height="34" rx="17" fill="#06100b" stroke="#3ddc84" stroke-width="1.6"></rect><use href="#i-mon" x="10" y="7" width="20" height="20" style="color:#d5e1d8"></use><text x="38" y="22" class="t tm tw">DISPLAY</text><use href="#i-ok" x="140" y="7" width="20" height="20" style="color:#3ddc84"></use></g></svg>