</defs><rect width="100%" height="100%" fill="#06100b"/><text x="600" y="50" class="th mid txl">THE LAPTOP LOOKS OFF —</text><text x="600" y="82" class="th mid txl" style="fill:#f2c230">BUT PARTS OF THE BOARD MAY STILL BE POWERED</text><rect x="370" y="110" width="460" height="270" rx="14" fill="#141a17" stroke="#3a4842" stroke-width="2"></rect><rect x="386" y="126" width="428" height="236" rx="4" fill="#020403"></rect><path d="M386,126 L520,126 L386,250Z" fill="#ffffff" opacity=".03"></path><text x="600" y="252" class="t mid tm c-mute">SCREEN OFF</text><path d="M330,384 H870 L920,420 H280Z" fill="#1a211d" stroke="#3a4842" stroke-width="2"></path><rect x="560" y="404" width="80" height="8" rx="4" fill="#0c100e"></rect><path d="M320,420 L60,470 M880,420 L1140,470" stroke="#2c4a3a" stroke-dasharray="4 5"></path><rect x="40" y="470" width="1120" height="300" rx="10" fill="#08130e" stroke="#2c4a3a"></rect><text x="56" y="492" class="t ts tw c-dim">X-RAY · SHUTDOWN STATE (S5) WITH BATTERY PRESENT</text><rect x="60" y="504" width="350" height="74" rx="8" fill="#0b100e" stroke="#56645c" stroke-width="2"></rect><circle cx="86" cy="541" r="9" fill="#26302b"></circle><text x="106" y="536" class="th " style="font-size:17px;fill:#7f8f86">CPU</text><text x="106" y="558" class="t ts c-dim">0 V</text><text x="396" y="536" class="t end ts tw" style="fill:#7f8f86">OFF</text><rect x="426" y="504" width="350" height="74" rx="8" fill="#0b100e" stroke="#56645c" stroke-width="2"></rect><circle cx="452" cy="541" r="9" fill="#26302b"></circle><text x="472" y="536" class="th " style="font-size:17px;fill:#7f8f86">GPU</text><text x="472" y="558" class="t ts c-dim">0 V</text><text x="762" y="536" class="t end ts tw" style="fill:#7f8f86">OFF</text><rect x="792" y="504" width="350" height="74" rx="8" fill="#0b100e" stroke="#56645c" stroke-width="2"></rect><circle cx="818" cy="541" r="9" fill="#26302b"></circle><text x="838" y="536" class="th " style="font-size:17px;fill:#7f8f86">MAIN RAILS</text><text x="838" y="558" class="t ts c-dim">5V · 3V3 → 0 V</text><text x="1128" y="536" class="t end ts tw" style="fill:#7f8f86">OFF</text><rect x="60" y="590" width="350" height="74" rx="8" fill="#0c1b14" stroke="#3ddc84" stroke-width="2" filter="url(#glow)"></rect><circle cx="86" cy="627" r="9" fill="#3ddc84" filter="url(#glow)"></circle><text x="106" y="622" class="th " style="font-size:17px;fill:#e9f0e6">BATTERY</text><text x="106" y="644" class="t ts c-dim">VBAT ≈ 12 V</text><text x="396" y="622" class="t end ts tw" style="fill:#3ddc84">LIVE</text><rect x="426" y="590" width="350" height="74" rx="8" fill="#0c1b14" stroke="#3ddc84" stroke-width="2" filter="url(#glow)"></rect><circle cx="452" cy="627" r="9" fill="#3ddc84" filter="url(#glow)"></circle><text x="472" y="622" class="th " style="font-size:17px;fill:#e9f0e6">CHARGER IC</text><text x="472" y="644" class="t ts c-dim">VSYS present</text><text x="762" y="622" class="t end ts tw" style="fill:#3ddc84">LIVE</text><rect x="792" y="590" width="350" height="74" rx="8" fill="#0c1b14" stroke="#f2c230" stroke-width="2" stroke-dasharray="7 5" filter="url(#glow)"></rect><circle cx="818" cy="627" r="9" fill="#f2c230" filter="url(#glow)" class="pulse"></circle><text x="838" y="622" class="th " style="font-size:17px;fill:#e9f0e6">EC</text><text x="838" y="644" class="t ts c-dim">3.3V_AUX</text><text x="1128" y="622" class="t end ts tw" style="fill:#f2c230">POSSIBLY LIVE</text><rect x="60" y="676" width="350" height="74" rx="8" fill="#0c1b14" stroke="#f2c230" stroke-width="2" stroke-dasharray="7 5" filter="url(#glow)"></rect><circle cx="86" cy="713" r="9" fill="#f2c230" filter="url(#glow)" class="pulse"></circle><text x="106" y="708" class="th " style="font-size:17px;fill:#e9f0e6">USB-C PD CONTROLLER</text><text x="106" y="730" class="t ts c-dim">AUX or VBUS</text><text x="396" y="708" class="t end ts tw" style="fill:#f2c230">POSSIBLY LIVE</text><rect x="426" y="676" width="350" height="74" rx="8" fill="#0c1b14" stroke="#f2c230" stroke-width="2" filter="url(#glow)"></rect><circle cx="452" cy="713" r="9" fill="#f2c230" filter="url(#glow)"></circle><text x="472" y="708" class="th " style="font-size:17px;fill:#e9f0e6">WAKE LOGIC</text><text x="472" y="730" class="t ts c-dim">lid · button · LAN</text><text x="762" y="708" class="t end ts tw" style="fill:#f2c230">LIVE</text><rect x="792" y="676" width="350" height="74" rx="8" fill="#0c1b14" stroke="#f2c230" stroke-width="2" filter="url(#glow)"></rect><circle cx="818" cy="713" r="9" fill="#f2c230" filter="url(#glow)"></circle><text x="838" y="708" class="th " style="font-size:17px;fill:#e9f0e6">RTC DOMAIN</text><text x="838" y="730" class="t ts c-dim">clock + CMOS</text><text x="1128" y="708" class="t end ts tw" style="fill:#f2c230">LIVE</text></svg>