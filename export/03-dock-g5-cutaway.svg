<svg width="1200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" class="fig-svg " role="img" aria-label="HP USB-C Dock G5 functional cutaway"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
.t{font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;fill:#e9f0e6;font-size:12px;letter-spacing:.02em}
.th{font-family:'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:700;font-stretch:78%;letter-spacing:.03em;fill:#e9f0e6}
.ts{font-size:10px}.tm{font-size:14px}.tl{font-size:17px}.txl{font-size:24px}.txxl{font-size:36px}.tw{font-weight:700}
