-width="1.6"></rect><text x="447" y="164" class="th mid" style="font-size:15px;fill:#e9f0e6">DOCK MGMT</text><text x="447" y="184" class="t mid ts c-dim">controller (DMC)</text><text x="447" y="200" class="t mid ts c-dim">firmware updates</text><g transform="translate(468,144)"><rect x="0" y="-12" width="46" height="17" rx="3" fill="#06100b" stroke="#d5e1d8" stroke-width="1"></rect><text x="7" y="0.5" class="t ts" style="fill:#d5e1d8">HP FW</text></g></g><g><rect x="372" y="470" width="150" height="110" rx="8" fill="#0c1b14" stroke="#3ddc84" stroke-width="1.6"></rect><text x="447" y="494" class="th mid" style="font-size:15px;fill:#e9f0e6">POWER STAGE</text><text x="447" y="514" class="t mid ts c-dim">from dock AC adapter</text><text x="447" y="530" class="t mid ts c-dim">5·9·10·12·15·20 V</text><text x="447" y="546" class="t mid ts c-dim">≤ 5 A to host</text><g transform="translate(455.2,474)"><rect x="0" y="-12" width="58.800000000000004" height="17" rx="3" fill="#06100b" stroke="#3ddc84" stroke-width="1"></rect><text x="7" y="0.5" class="t ts" style="fill:#3ddc84">HP SPEC</text></g></g><g><rect x="552" y="300" width="110" height="96" rx="8" fill="#0c1b14" stroke="#97ad9f" stroke-width="1.6" stroke-dasharray="6 5"></rect><text x="607" y="324" class="th mid" style="font-size:14px;fill:#e9f0e6">LANE SPLIT</text><text x="607" y="344" class="t mid ts c-dim">dock-side mux</text><text x="607" y="360" class="t mid ts c-dim">USB 3 ↔ DP</text></g><g><rect x="692" y="130" width="160" height="92" rx="8" fill="#0c1b14" stroke="#b07cff" stroke-width="1.6" stroke-dasharray="6 5"></rect><text x="772" y="154" class="th mid" style="font-size:15px;fill:#e9f0e6">USB 3 HUB</text><text x="772" y="174" class="t mid ts c-dim">USB 2 + USB 3</text><text x="772" y="190" class="t mid ts c-dim">audio codec on hub</text></g><g><rect x="692" y="262" width="160" height="44" rx="8" fill="#0c1b14" stroke="#b07cff" stroke-width="1.6" stroke-dasharray="6 5"></rect><text x="772" y="290" class="th mid" style="font-size:14px;fill:#e9f0e6">GbE NIC · USB</text></g><g><rect x="700" y="400" width="150" height="110" rx="8" fill="#0c1b14" stroke="#46d7e6" stroke-width="1.6"></rect><text x="775" y="424" class="th mid" style="font-size:15px;fill:#e9f0e6">GRAPHIC CTRL</text><text x="775" y="444" class="t mid ts c-dim">“Docking Graphic</text><text x="775" y="460" class="t mid ts c-dim">Controller” · DP</text><text x="775" y="476" class="t mid ts c-dim">MST-style split</text><g transform="translate(796,404)"><rect x="0" y="-12" width="46" height="17" rx="3" fill="#06100b" stroke="#46d7e6" stroke-width="1"></rect><text x="7" y="0.5" class="t ts" style="fill:#46d7e6">HP FW</text></g></g><path d="M330,342 H372" class="tr" stroke="#3ddc84" stroke-width="3" marker-end="url(#ar-pwr)"></path><path d="M522,348 H552" class="tr" stroke="#b07cff" stroke-width="3" marker-end="url(#ar-io)"></path><path d="M662,330 C682,330 672,176 690,176" class="tr" stroke="#b07cff" stroke-width="3" marker-end="url(#ar-io)"></path><path d="M662,368 C684,368 676,455 698,455" class="tr" stroke="#46d7e6" stroke-width="3" marker-end="url(#ar-dp)"></path><path d="M772,222 V260" class="tr" stroke="#b07cff" stroke-width="2" marker-end="url(#ar-io)"></path><path d="M447,300 V236" class="tr" stroke="#97ad9f" stroke-width="1.5" marker-end="url(#ar-ink)" stroke-dasharray="4 4"></path><text x="456" y="272" class="t ts c-mute">I²C / mgmt</text><path d="M447,470 V396" class="tr" stroke="#3ddc84" stroke-width="3" marker-end="url(#ar-pwr)"></path><rect x="900" y="130" width="24" height="14" rx="3" fill="#0a0d0c" stroke="#b07cff" stroke-width="1.6"></rect><text x="932" y="141" class="t ts tw">2× USB-A 3.0 (back)</text><rect x="900" y="168" width="24" height="14" rx="3" fill="#0a0d0c" stroke="#b07cff" stroke-width="1.6"></rect><text x="932" y="179" class="t ts tw">2× USB-A 3.0 (side)</text><rect x="900" y="206" width="20" height="12" rx="3" fill="#0a0d0c" stroke="#b07cff" stroke-width="1.6"></rect><text x="928" y="216" class="t ts tw">USB-C front · data + 15 W</text><rect x="900" y="243" width="24" height="12" rx="3" fill="#0a0d0c" stroke="#b07cff" stroke-width="1.6"></rect><text x="932" y="253" class="t ts tw">Audio combo jack</text><rect x="900" y="273" width="24" height="18" rx="3" fill="#0a0d0c" stroke="#b07cff" stroke-width="1.6"></rect><text x="932" y="286" class="t ts tw">RJ45 · 10/100/1000</text><rect x="900" y="404" width="24" height="14" rx="3" fill="#0a0d0c" stroke="#46d7e6" stroke-width="1.6"></rect><text x="932" y="415" class="t ts tw">DisplayPort 1.4 · ×2</text><rect x="900" y="452" width="26" height="12" rx="3" fill="#0a0d0c" stroke="#46d7e6" stroke-width="1.6"></rect><text x="934" y="462" class="t ts tw">HDMI 2.0</text><rect x="900" y="560" width="24" height="20" rx="3" fill="#0a0d0c" stroke="#3ddc84" stroke-width="1.6"></rect><text x="932" y="574" class="t ts tw">Power in (dock adapter)</text><path d="M852,145 C872,145 878,137 896,137" class="tr" stroke="#b07cff" stroke-width="2" marker-end="url(#ar-io)"></path><path d="M852,168 C872,168 878,175 896,175" class="tr" stroke="#b07cff" stroke-width="2" marker-end="url(#ar-io)"></path><path d="M852,190 C872,190 878,212 896,212" class="tr" stroke="#b07cff" stroke-width="2" marker-end="url(#ar-io)"></path><path d="M852,208 C872,208 878,249 896,249" class="tr" stroke="#b07cff" stroke-width="2" marker-end="url(#ar-io)"></path><path d="M852,282 H896" class="tr" stroke="#b07cff" stroke-width="2" marker-end="url(#ar-io)"></path><path d="M850,430 H896" class="tr" stroke="#46d7e6" stroke-width="2.5" marker-end="url(#ar-dp)"></path><path d="M850,470 C870,470 875,458 896,458" class="tr" stroke="#46d7e6" stroke-width="2.5" marker-end="url(#ar-dp)"></path><path d="M896,570 C700,610 600,560 522,540" class="tr" stroke="#3ddc84" stroke-width="2.5" marker-end="url(#ar-pwr)"></path><rect x="30" y="470" width="280" height="150" rx="6" fill="#0b1712" stroke="#24402f"></rect><text x="44" y="494" class="t ts" style="fill:#cfdcd2"><tspan x="44" dy="0">NOT THUNDERBOLT</tspan><tspan x="44" dy="17">HP: Thunderbolt laptops “function at</tspan><tspan x="44" dy="17">USB-C speeds”. No PCIe tunnelling.</tspan><tspan x="44" dy="17">Host needs PD + DP Alt Mode.</tspan><tspan x="44" dy="17">Technical notes: 2 external displays</tspan><tspan x="44" dy="17">+ host panel (all three outputs usable).</tspan></text><g transform="translate(30,90)"><rect width="280" height="120" rx="6" fill="#0b1712" stroke="#24402f"></rect><text x="14" y="24" class="t ts" style="fill:#cfdcd2"><tspan x="14" dy="0">HP FIRMWARE PACKAGE LISTS</tspan><tspan x="14" dy="18">• Dock Management Controller</tspan><tspan x="14" dy="18">• Power Delivery Controller</tspan><tspan x="14" dy="18">• Docking Graphic Controller</tspan><tspan x="14" dy="18">(SoftPaq release notes)</tspan></text></g></svg>