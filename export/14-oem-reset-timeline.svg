</defs><rect width="100%" height="100%" fill="#06100b"/><text x="40" y="44" class="th txl">OEM-DOCUMENTED POWER-BUTTON PROCEDURES · 0–60 s</text><text x="40" y="64" class="t ts c-dim">Only timings found in OEM / spec documentation are plotted · hover a mark for its source</text><rect x="40" y="82" width="16" height="10" rx="2" fill="#4ea2ff"></rect><text x="62" y="92" class="t ts">FORCED SHUTDOWN</text><rect x="300" y="82" width="16" height="10" rx="2" fill="#3ddc84"></rect><text x="322" y="92" class="t ts">HARDWARE / RESIDUAL RESET</text><rect x="560" y="82" width="16" height="10" rx="2" fill="#ff9f1a"></rect><text x="582" y="92" class="t ts">EC / BATTERY-DISCONNECT RESET</text><rect x="820" y="82" width="16" height="10" rx="2" fill="#b07cff"></rect><text x="842" y="92" class="t ts">RTC RESET</text><text x="1150" y="92" class="t end ts c-mute">no OEM-published battery-reset timing</text><path d="M270,112 V470" stroke="#18301f" stroke-width="1"></path><text x="270" y="492" class="t mid ts c-dim">0 s</text><path d="M343.3333333333333,112 V470" stroke="#18301f" stroke-width="1"></path><text x="343.3333333333333" y="492" class="t mid ts c-dim">5</text><path d="M416.66666666666663,112 V470" stroke="#18301f" stroke-width="1"></path><text x="416.66666666666663" y="492" class="t mid ts c-dim">10</text><path d="M490,112 V470" stroke="#18301f" stroke-width="1"></path><text x="490" y="492" class="t mid ts c-dim">15</text><path d="M563.3333333333333,112 V470" stroke="#18301f" stroke-width="1"></path><text x="563.3333333333333" y="492" class="t mid ts c-dim">20</text><path d="M636.6666666666667,112 V470" stroke="#18301f" stroke-width="1"></path><text x="636.6666666666667" y="492" class="t mid ts c-dim">25</text><path d="M710,112 V470" stroke="#18301f" stroke-width="1"></path><text x="710" y="492" class="t mid ts c-dim">30</text><path d="M783.3333333333334,112 V470" stroke="#10221a" stroke-width="1"></path><path d="M856.6666666666666,112 V470" stroke="#18301f" stroke-width="1"></path><text x="856.6666666666666" y="492" class="t mid ts c-dim">40</text><path d="M930,112 V470" stroke="#18301f" stroke-width="1"></path><text x="930" y="492" class="t mid ts c-dim">45</text><path d="M1003.3333333333334,112 V470" stroke="#10221a" stroke-width="1"></path><path d="M1076.6666666666665,112 V470" stroke="#10221a" stroke-width="1"></path><path d="M1150,112 V470" stroke="#18301f" stroke-width="1"></path><text x="1150" y="492" class="t mid ts c-dim">60</text><path d="M270,130 H1150" stroke="#1e3a2b" stroke-width="1"></path><text x="40" y="134" class="t ts tw">ACPI SPEC · ALL PCs</text><path d="M270,192 H1150" stroke="#1e3a2b" stroke-width="1"></path><text x="40" y="196" class="t ts tw">HP · EliteBook / ProBook / ZBook</text><path d="M270,254 H1150" stroke="#1e3a2b" stroke-width="1"></path><text x="40" y="258" class="t ts tw">DELL · Latitude / Precision</text><path d="M270,316 H1150" stroke="#1e3a2b" stroke-width="1"></path><text x="40" y="320" class="t ts tw">DELL · RTC</text><path d="M270,378 H1150" stroke="#1e3a2b" stroke-width="1"></path><text x="40" y="382" class="t ts tw">LENOVO · ThinkPad</text><path d="M270,440 H1150" stroke="#1e3a2b" stroke-width="1"></path><text x="40" y="444" class="t ts tw">MICROSOFT · Surface</text><rect x="912" y="104" width="36" height="366" fill="rgba(233,240,230,.06)"></rect><path d="M930,104 V470" stroke="#e9f0e6" stroke-width="2.5" filter="url(#glow)"></path><rect x="876" y="474" width="108" height="26" rx="13" fill="#e9f0e6"></rect><text x="930" y="492" class="th mid" style="font-size:13px;fill:#06100b">45 s · YOUR HOLD</text><g class="tip" data-tip="&gt; 4 s → power-button override → soft-off (S5) — ACPI 6.5 §4.8.2.2.1.3"><path d="M328.6666666666667,119 l9,11 -9,11 -9,-11z" fill="#4ea2ff" filter="url(#glow)"></path><path d="M340.6666666666667,130 H374.6666666666667" stroke="#4ea2ff" stroke-width="2" marker-end="url(#ar-main)"></path><text x="382.6666666666667" y="116" class="t ts" style="fill:#cfdcd2">&gt; 4 s → power-button override → soft-off (S5)</text><title>&gt; 4 s → power-button override → soft-off (S5) — ACPI 6.5 §4.8.2.2.1.3</title></g><g class="tip" data-tip="Power (hard) reset · AC unplugged · ≈ 15 s — HP Support: Perform a power reset"><path d="M490,181 l9,11 -9,11 -9,-11z" fill="#3ddc84" filter="url(#glow)"></path><text x="506" y="178" class="t ts" style="fill:#cfdcd2">Power (hard) reset · AC unplugged · ≈ 15 s</text><title>Power (hard) reset · AC unplugged · ≈ 15 s — HP Support: Perform a power reset</title></g><g class="tip" data-tip="Hard reset · “flea power” drain · 15–20 s — Dell KB 000139016"><rect x="490" y="246" width="73.33333333333326" height="16" rx="4" fill="#3ddc84" filter="url(#glow)"></rect><text x="575.3333333333333" y="240" class="t ts" style="fill:#cfdcd2">Hard reset · “flea power” drain · 15–20 s</text><title>Hard reset · “flea power” drain · 15–20 s — Dell KB 000139016</title></g><g class="tip" data-tip="RTC reset · AC on · ≈ 30–35 s (LED 3×) · aborts &lt; 25 s or &gt; 40 s — Dell KB 000125880"><rect x="636.6666666666667" y="304" width="219.9999999999999" height="24" fill="url(#hatchGray)" stroke="#b07cff" stroke-dasharray="4 3" opacity=".9"></rect><rect x="710" y="308" width="73.33333333333337" height="16" rx="4" fill="#b07cff" filter="url(#glow)"></rect><text x="856.6666666666666" y="298" class="t ts end" style="fill:#cfdcd2">RTC reset · AC on · ≈ 30–35 s (LED 3×) · aborts &lt; 25 s or &gt; 40 s</text><title>RTC reset · AC on · ≈ 30–35 s (LED 3×) · aborts &lt; 25 s or &gt; 40 s — Dell KB 000125880</title></g><g class="tip" data-tip="Emergency-reset pinhole · AC removed · no duration published — Lenovo HT510479 / T460 docs"><circle cx="270" cy="378" r="9" fill="#06100b" stroke="#ff9f1a" stroke-width="2.5" stroke-dasharray="3 2"></circle><text x="288" y="364" class="t ts" style="fill:#cfdcd2">Emergency-reset pinhole · AC removed · no duration published</text><title>Emergency-reset pinhole · AC removed · no duration published — Lenovo HT510479 / T460 docs</title></g><g class="tip" data-tip="Force restart · ≈ 20 s until logo (newer models) — Microsoft Support 4036280"><path d="M563.3333333333333,429 l9,11 -9,11 -9,-11z" fill="#4ea2ff" filter="url(#glow)"></path><text x="579.3333333333333" y="426" class="t ts" style="fill:#cfdcd2">Force restart · ≈ 20 s until logo (newer models)</text><title>Force restart · ≈ 20 s until logo (newer models) — Microsoft Support 4036280</title></g><g class="tip" data-tip="Older models: power + volume-up ≈ 15 s — Microsoft Support 4036280"><path d="M490,445 l9,11 -9,11 -9,-11z" fill="#4ea2ff" filter="url(#glow)"></path><text x="506" y="460" class="t ts" style="fill:#cfdcd2">Older models: power + volume-up ≈ 15 s</text><title>Older models: power + volume-up ≈ 15 s — Microsoft Support 4036280</title></g><rect x="40" y="516" width="1110" height="92" rx="8" fill="#0a1611" stroke="#24402f"></rect><text x="60" y="546" class="th " style="font-size:19px">IS 45 SECONDS ACTUALLY SPECIAL?</text><text x="420" y="546" class="th " style="font-size:19px;fill:#3ddc84">NO — IT IS MARGIN, NOT MAGIC.</text><text x="60" y="570" class="t ts">Every verified threshold above is ≤ 40 s. A 45 s hold passes all of them, so whichever one this laptop uses, it fired.</text><text x="60" y="590" class="t ts" style="fill:#ff9f1a">Caution: Dell’s RTC reset aborts if held &gt; 40 s with AC connected — longer is not automatically “deeper”.</text></svg>