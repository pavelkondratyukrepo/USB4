xt><text x="353" y="264" class="t mid" style="font-size:7.5px;fill:#0a0d0e;font-weight:700">B5</text><rect x="378" y="238" width="20" height="30" rx="2" fill="#3ddc84"></rect><text x="388" y="288" class="t mid ts" style="fill:#e9f0e6;font-size:9px">VBUS</text><text x="388" y="264" class="t mid" style="font-size:7.5px;fill:#0a0d0e;font-weight:700">B4</text><rect x="413" y="238" width="20" height="30" rx="2" fill="#b07cff"></rect><rect x="423" y="238" width="10" height="30" rx="2" fill="#46d7e6"></rect><text x="423" y="288" class="t mid ts" style="fill:#e9f0e6;font-size:9px">TX2−</text><text x="423" y="264" class="t mid" style="font-size:7.5px;fill:#0a0d0e;font-weight:700">B3</text><rect x="448" y="238" width="20" height="30" rx="2" fill="#b07cff"></rect><rect x="458" y="238" width="10" height="30" rx="2" fill="#46d7e6"></rect><text x="458" y="288" class="t mid ts" style="fill:#e9f0e6;font-size:9px">TX2+</text><text x="458" y="264" class="t mid" style="font-size:7.5px;fill:#0a0d0e;font-weight:700">B2</text><rect x="483" y="238" width="20" height="30" rx="2" fill="#5d6a63"></rect><text x="493" y="288" class="t mid ts" style="fill:#8a968f;font-size:9px">GND</text><text x="493" y="264" class="t mid" style="font-size:7.5px;fill:#0a0d0e;font-weight:700">B1</text><rect x="60" y="349" width="20" height="14" rx="2" fill="#3ddc84"></rect><text x="92" y="360" class="t ts">POWER · VBUS + CC (PD messages ride CC)</text><rect x="60" y="373" width="20" height="14" rx="2" fill="#b07cff"></rect><text x="92" y="384" class="t ts">USB 2.0 · D+/D−</text><rect x="60" y="397" width="20" height="14" rx="2" fill="#b07cff"></rect><rect x="70" y="397" width="10" height="14" rx="2" fill="#46d7e6"></rect><text x="92" y="408" class="t ts">SUPERSPEED PAIRS — shared:</text><text x="300" y="408" class="t ts c-dim">USB 3 or DisplayPort, set by the mux</text><rect x="60" y="421" width="20" height="14" rx="2" fill="#46d7e6"></rect><text x="92" y="432" class="t ts">SBU1/2 → DP AUX in Alt Mode</text><rec