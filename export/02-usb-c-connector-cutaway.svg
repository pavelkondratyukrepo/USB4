ss="t  ts c-dim">DisplayPort Alt Mode</text></g><text x="1110" y="58" class="t mid ts tw c-dim">INCIDENT</text><use href="#i-ok" x="1088" y="108" width="44" height="44" style="color:#3ddc84" filter="url(#glow)"></use><text x="1110" y="172" class="t mid ts tw c-pwr">WORKING</text><use href="#i-x" x="1088" y="270" width="44" height="44" style="color:#ff4f4f" filter="url(#glow)"></use><text x="1110" y="334" class="t mid ts tw c-fail">MISSING</text><use href="#i-x" x="1088" y="432" width="44" height="44" style="color:#ff4f4f" filter="url(#glow)"></use><text x="1110" y="496" class="t mid ts tw c-fail">MISSING</text><rect x="660" y="540" width="500" height="54" rx="6" fill="rgba(255,79,79,.08)" stroke="#ff4f4f" stroke-opacity=".6"></rect><text x="680" y="562" class="t ts tw">Charging shows VBUS + CC + PD were working.</text><text x="680" y="580" class="t ts c-dim">It says nothing about the data and display paths.</text></svg>