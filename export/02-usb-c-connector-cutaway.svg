<svg width="1200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" class="fig-svg " role="img" aria-label="USB-C connector cutaway: power works, USB data and DisplayPort missing"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
