<svg width="1200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" class="fig-svg " role="img" aria-label="Why a 45 second hold may have worked: timing margin"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
.t{font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;fill:#e9f0e6;font-size:12px;letter-spacing:.02em}
.th{font-family:'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;font-weight:700;font-stretch:78%;letter-spacing:.03em;fill:#e9f0e6}
.ts{font-size:10px}.tm{font-size:14px}.tl{font-size:17px}.txl{font-size:24px}.txxl{font-size:36px}.tw{font-weight:700}
.mid{text-anchor:middle}.end{text-anchor:end}
.c-dim{fill:#97ad9f}.c-mute{fill:#62796b}.c-pwr{fill:#3ddc84}.c-aux{fill:#f2c230}.c-main{fill:#4ea2ff}
.c-io{fill:#b07cff}.c-fail{fill:#ff4f4f}.c-off{fill:#7f8f86}.c-warn{fill:#ff9f1a}.c-ink{fill:#d5e1d8}.c-bg{fill:#06100b}
.tr{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pad{fill:#d8b66c}.pkg{fill:#111416;stroke:#2b3236;stroke-width:1}.pkg-top{fill:#1a1e21}
.pin1{fill:#3a4247}.ic-l{font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;font-size:11px;font-weight:700;fill:#e9f0e6}
.ic-s{font-family:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;font-size:8.5px;fill:#97ad9f}
.silk{fill:none;stroke:#e9f0e6;stroke-opacity:.55;stroke-width:1}
.box{fill:#0c1b14;stroke:#24402f;stroke-width:1.2}
.box2{fill:#0f241a;stroke:#2c5541;stroke-width:1.2}
.hit{cursor:pointer}.hit:hover .pkg-top,.hit:focus .pkg-top{fill:#26313a}
.hit:focus{outline:none}.hit:focus-visible .ring{stroke:#fff;stroke-width:2.5;opacity:1}
.flow{stroke-dasharray:3 13;animation:flow 1.1s linear infinite}
.flow-slow{stroke-dasharray:3 13;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.boot{animation:bootOn .9s ease-out both}
@keyframes bootOn{from{stroke:#56645c;opacity:.35}}
.fade-in{animation:fadeIn .5s ease-out both}
@keyframes fadeIn{from{opacity:0}}
@media (prefers-reduced-motion: reduce){.flow,.flow-slow,.pulse,.boot,.fade-in{animation:none}}
</style><defs>
<filter id="glow" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="9000" height="9000"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowBig" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="9000" height="9000"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".55"/></filter>
