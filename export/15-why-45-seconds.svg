<pattern id="hatchRed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="rgba(255,79,79,.10)"/><line x1="0" y1="0" x2="0" y2="8" stroke="#ff4f4f" stroke-width="2" stroke-opacity=".55"/></pattern>
<pattern id="hatchGray" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#56645c" stroke-width="1.5" stroke-opacity=".6"/></pattern>
<pattern id="hatchYel" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#f2c230" stroke-width="1.5" stroke-opacity=".5"/></pattern>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd6da"/><stop offset=".5" stop-color="#8b959b"/><stop offset="1" stop-color="#5d666b"/></linearGradient>
<linearGradient id="cell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c3a33"/><stop offset="1" stop-color="#18211c"/></linearGradient>
<linearGradient id="die" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a6670"/><stop offset=".45" stop-color="#2f363c"/><stop offset="1" stop-color="#4a545c"/></linearGradient>
<marker id="ar-dp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#46d7e6"/></marker><marker id="ar-pwr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc84"/></marker><marker id="ar-aux" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2c230"/></marker><marker id="ar-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4ea2ff"/></marker><marker id="ar-io" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07cff"/></marker><marker id="ar-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff4f4f"/></marker><marker id="ar-off" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56645c"/></marker><marker id="ar-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d5e1d8"/></marker><marker id="ar-warn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f1a"/></marker><marker id="ar-sig" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d6cc"/></marker>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13.5 2 4 14h6.5L9 22l11-13.5h-7z" fill="currentColor"/></symbol>
<symbol id="i-usb" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V4"/><path d="M9 6.5 12 2l3 4.5z" fill="currentColor"/><path d="M12 15 6.5 11.5V8.5"/><circle cx="6.5" cy="7" r="1.6" fill="currentColor"/><path d="M12 18l5.5-3.5V11"/><rect x="15.8" y="8" width="3.4" height="3.4" fill="currentColor"/><circle cx="12" cy="20.5" r="1.8" fill="currentColor"/></g></symbol>
<symbol id="i-mon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="3.5" width="19" height="13" rx="1.5"/><path d="M8.5 20.5h7M12 16.5v4" stroke-linecap="round"/></g></symbol>
<symbol id="i-net" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 7h16v11H4z"/><path d="M8 18v-4h8v4M9 7V4h6v3"/></g></symbol>
<symbol id="i-ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7 12.5 3.2 3.2L17 9" fill="none" stroke="#06100b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m8 8 8 8M16 8l-8 8" stroke="#06100b" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 2.5 22.5 21h-21z" fill="currentColor"/><path d="M12 9v5.5" stroke="#06100b" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.4" fill="#06100b"/></symbol>
<symbol id="i-q" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M9.2 9.3a2.9 2.9 0 1 1 3.9 2.7c-.8.3-1.1.9-1.1 1.7v.5" fill="none" stroke="#06100b" stroke-width="2.3" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.3" fill="#06100b"/></symbol>
<symbol id="i-btn" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M7.2 6.2a7.5 7.5 0 1 0 9.6 0"/></g></symbol>
</defs><rect width="100%" height="100%" fill="#06100b"/><text x="40" y="44" class="th txl">WHY A 45-SECOND HOLD MAY HAVE WORKED</text><text x="40" y="64" class="t ts c-dim">Proportional bar · regulator + rail timing is board-dependent (ms → s); everything after it is margin</text><circle cx="80" cy="100" r="10" fill="#06100b" stroke="#d5e1d8" stroke-width="3"></circle><path d="M80,110 V142" stroke="#2c4a3a" stroke-width="2"></path><text x="104" y="106" class="th " style="font-size:16px">POWER BUTTON HELD</text><text x="420" y="105" class="t ts c-dim">EC starts counting</text><circle cx="80" cy="152" r="10" fill="#06100b" stroke="#4ea2ff" stroke-width="3"></circle><path d="M80,162 V194" stroke="#2c4a3a" stroke-width="2"></path><text x="104" y="158" class="th " style="font-size:16px">FORCED-OFF THRESHOLD</text><text x="420" y="157" class="t ts c-dim">ACPI &gt; 4 s · OEM/platform dependent</text><circle cx="80" cy="204" r="10" fill="#06100b" stroke="#ff9f1a" stroke-width="3"></circle><path d="M80,214 V246" stroke="#2c4a3a" stroke-width="2"></path><text x="104" y="210" class="th " style="font-size:16px">REGULATORS DISABLED</text><text x="420" y="209" class="t ts c-dim">EC drops EN lines</text><circle cx="80" cy="256" r="10" fill="#06100b" stroke="#f2c230" stroke-width="3"></circle><path d="M80,266 V298" stroke="#2c4a3a" stroke-width="2"></path><text x="104" y="262" class="th " style="font-size:16px">RAILS COLLAPSE</text><text x="420" y="261" class="t ts c-dim">capacitors drain through loads</text><circle cx="80" cy="308" r="10" fill="#06100b" stroke="#ff4f4f" stroke-width="3"></circle><path d="M80,318 V350" stroke="#2c4a3a" stroke-width="2"></path><text x="104" y="314" class="th " style="font-size:16px">RETENTION THRESHOLD CROSSED</text><text x="420" y="313" class="t ts c-dim">controller can no longer hold state</text><circle cx="80" cy="360" r="10" fill="#06100b" stroke="#56645c" stroke-width="3"></circle><text x="104" y="366" class="th " style="font-size:16px">VOLATILE STATE LOST</text><text x="420" y="365" class="t ts c-dim">stuck Alt Mode / mux state gone</text><path d="M80,380 V412" stroke="#2c4a3a" stroke-width="2" stroke-dasharray="4 4"></path><circle cx="80" cy="424" r="12" fill="#e9f0e6"></circle><text x="104" y="432" class="th " style="font-size:20px">45 s · RELEASED</text><text x="330" y="432" class="th " style="font-size:18px;fill:#3ddc84">“large timing margin”</text><rect x="60" y="486" width="96" height="40" fill="#4ea2ff" opacity=".85"></rect><rect x="156" y="486" width="76.80000000000001" height="40" fill="#f2c230" opacity=".9"></rect><rect x="232.8" y="486" width="907.2" height="40" fill="url(#hatchGray)" stroke="#3ddc84" stroke-width="2"></rect><text x="108" y="548" class="t mid ts c-main">wait for EC</text><text x="194.4" y="548" class="t mid ts c-aux">off + decay*</text><text x="683.9999999999999" y="513" class="th mid" style="font-size:18px;fill:#3ddc84">MARGIN ≈ 38 s</text><text x="60" y="478" class="t mid ts c-mute">0s</text><text x="180" y="478" class="t mid ts c-mute">5s</text><text x="300" y="478" class="t mid ts c-mute">10s</text><text x="420" y="478" class="t mid ts c-mute">15s</text><text x="540" y="478" class="t mid ts c-mute">20s</text><text x="660" y="478" class="t mid ts c-mute">25s</text><text x="780" y="478" class="t mid ts c-mute">30s</text><text x="900" y="478" class="t mid ts c-mute">35s</text><text x="1020" y="478" class="t mid ts c-mute">40s</text><text x="1140" y="478" class="t mid ts c-mute">45s</text><g transform="translate(700,92)"><rect width="440" height="120" rx="10" fill="#140b0b" stroke="#ff4f4f"></rect><use href="#i-x" x="20" y="22" width="40" height="40" style="color:#ff4f4f"></use><text x="76" y="52" class="th " style="font-size:22px">45 s ≠ STRONGER DRAIN</text><text x="76" y="78" class="t ts c-dim">The button never carries the discharge current.</text><text x="76" y="96" class="t ts c-dim">Holding longer does not pull harder on the rails.</text></g><g transform="translate(700,228)"><rect width="440" height="120" rx="10" fill="#0a1a12" stroke="#3ddc84"></rect><use href="#i-ok" x="20" y="22" width="40" height="40" style="color:#3ddc84"></use><text x="76" y="52" class="th " style="font-size:22px">45 s = MORE TIMING MARGIN</text><text x="76" y="78" class="t ts c-dim">It outlasts every documented threshold and</text><text x="76" y="96" class="t ts c-dim">leaves seconds for slow-bleeding rails to reach 0 V.</text></g><text x="700" y="372" class="t ts" style="fill:#ff9f1a">…unless a specific OEM uses a timed routine that needs a longer hold.</text><text x="60" y="576" class="t ts c-mute">* decay segment is illustrative; real rails clear in milliseconds to seconds depending on capacitance and bleed resistance (see FIG 10).</text></svg>