px">STUCK STATE → SURVIVES?</text><text x="372" y="354" class="t ts" style="fill:#ff4f4f">same bad state</text><text x="60" y="396" class="t ts tw c-dim">RESULT</text><g transform="translate(60,406)"><rect width="150" height="34" rx="17" fill="#06100b" stroke="#3ddc84" stroke-width="1.6"></rect><use href="#i-bolt" x="10" y="7" width="20" height="20" style="color:#d5e1d8"></use><text x="38" y="22" class="t tm tw">POWER</text><use href="#i-ok" x="120" y="7" width="20" height="20" style="color:#3ddc84"></use></g><g transform="translate(220,406)"><rect width="150" height="34" rx="17" fill="#06100b" stroke="#ff4f4f" stroke-width="1.6"></rect><use href="#i-usb" x="10" y="7" width="20" height="20" style="color:#d5e1d8"></use><text x="38" y="22" class="t tm tw">USB</text><use href="#i-x" x="120" y="7" width="20" height="20" style="color:#ff4f4f"></use></g><g transform="translate(380,406)"><rect width="160" height="34" rx="17" fill="#06100b" stroke="#ff4f4f" stroke-width="1.6"></rect><use href="#i-mon" x="10" y="7" width="20" height="20" style="color:#d5e1d8"></use><text x="38" y="22" class="t tm tw">DISPLAY</text><use href="#i-x" x="130" y="7" width="20" height="20" style="color:#ff4f4f"></use></g><rect x="60" y="566" width="480" height="78" rx="4" fill="#050b08" stroke="#1d3428"></rect><path d="M140,566 V644" stroke="#11251a"></path><path d="M220,566 V644" stroke="#11251a"></path><path d="M300,566 V644" stroke="#11251a"></path><path d="M380,566 V644" stroke="#11251a"></path><path d="M460,566 V644" stroke="#11251a"></path><path d="M64,584 H536" class="tr" stroke="#f2c230" stroke-width="2.4" filter="url(#glow)"></path><text x="70" y="580" class="t ts c-aux">AUX rail feeding PD / mux logic</text><text x="534" y="640" class="t end ts" style="fill:#ff4f4f">never drops → state survives</text><rect x="620" y="20" width="560" height="640" rx="10" fill="#0a1611" stroke="#24402f"></rect><text x="644" y="60" class="th txl">HARDWARE POWER-STATE RESET</text><text x="644" y="82" class="t ts c-dim">long power-button hold · EC-controlled</text><rect x="660" y="104" width="300" height="34" rx="6" fill="#06100b" stroke="#f2c230" stroke-width="2" filter="url(#glow)"></rect><text x="676" y="127" class="th " style="font-size:15px">EC / POWER SEQUENCER</text><text x="972" y="126" class="t ts" style="fill:#f2c230">reads PWR_BTN#</text><path d="M810,138 V150" class="tr" stroke="#f2c230" stroke-width="2" marker-end="url(#ar-aux)"></path><rect x="660" y="152" width="300" height="34" rx="6" fill="#06100b" stroke="#ff9f1a" stroke-width="2" filter="url(#glow)"></rect><text x="676" y="175" class="th " style="font-size:15px">REGULATORS DISABLED</text><text x="972" y="174" class="t ts" style="fill:#ff9f1a">EN pins low</text><path d="M810,186 V198" class="tr" stroke="#ff9f1a" stroke-width="2" marker-end="url(#ar-warn)"></path><rect x="660" y="200" width="300" height="34" rx="6" fill="#06100b" stroke="#56645c" stroke-width="2"></rect><text x="676" y="223" class="th " style="font-size:15px">RELEVANT RAILS COLLAPSE</text><text x="972" y="222" class="t ts" style="fill:#56645c">caps discharge</text><path d="M810,234 V246" class="tr" stroke="#d5e1d8" stroke-width="2" marker-end="url(#ar-ink)"></path><rect x="660" y="248" width="300" height="34" rx="6" fill="#06100b" stroke="#56645c" stroke-width="2"></rect><text x="676" y="271" class="th " style="font-size:15px">CONTROLLER LOSES STATE</text><text x="972" y="270" class="t ts" style="fill:#56645c">volatile cleared</text><path d="M810,282 V294" class="tr" stroke="#d5e1d8" stroke-width="2" marker-end="url(#ar-ink)"></path><rect x="660" y="296" width="300" height="34" rx="6" fill="#06100b" stroke="#4ea2ff" stroke-width="2" filter="url(#glow)"></rect><text x="676" y="319" class="th " style="font-size:15px">COLD INITIALISATION</text><text x="972" y="318" class="t ts" style="fill:#4ea2ff">firmware reloads</text><path d="M810,330 V342" class="tr" stroke="#4ea2ff" stroke-width="2" marker-end="url(#ar-main)"></path><rect x="660" y="