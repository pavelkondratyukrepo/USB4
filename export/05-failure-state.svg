</defs><rect width="100%" height="100%" fill="#06100b"/><text x="40" y="50" class="th txl">WHERE THE CHAIN MOST LIKELY BROKE</text><text x="40" y="72" class="t ts c-dim">Observed: charging worked; the dock never appeared in Device Manager. Inferred: the break was probably before ANY USB enumeration, USB 2.0 included.</text><g transform="translate(932.2,18)"><rect width="243.79999999999998" height="24" rx="12" fill="#06100b" stroke="#ff9f1a" stroke-width="1.4" stroke-dasharray="5 3"></rect><text x="13" y="16" class="t ts tw" style="fill:#ff9f1a">HYPOTHESIS · AI-ASSISTED ANALYSIS</text></g><rect x="80" y="110" width="380" height="64" rx="10" fill="#06100b" stroke="#3ddc84" stroke-width="2.5" filter="url(#glow)"></rect><rect x="80" y="110" width="380" height="64" rx="10" fill="#06100b" opacity="0"></rect><text x="102" y="151" class="th " style="font-size:21px;fill:#e9f0e6">CC ATTACH</text><use href="#i-ok" x="410" y="122" width="40" height="40" style="color:#3ddc84" filter="url(#glow)"></use><path d="M270,174 V214" class="tr" stroke="#3ddc84" stroke-width="3" marker-end="url(#ar-pwr)"></path><rect x="80" y="218" width="380" height="64" rx="10" fill="#06100b" stroke="#3ddc84" stroke-width="2.5" filter="url(#glow)"></rect><rect x="80" y="218" width="380" height="64" rx="10" fill="#06100b" opacity="0"></rect><text x="102" y="259" class="th " style="font-size:21px;fill:#e9f0e6">PD NEGOTIATION</text><use href="#i-ok" x="410" y="230" width="40" height="40" style="color:#3ddc84" filter="url(#glow)"></use><path d="M460,250 H640" class="tr" stroke="#3ddc84" stroke-width="4" marker-end="url(#ar-pwr)" filter="url(#glow)"></path><rect x="650" y="214" width="320" height="72" rx="36" fill="#06100b" stroke="#3ddc84" stroke-width="2.5" filter="url(#glow)"></rect><use href="#i-bolt" x="674" y="232" width="36" height="36" style="color:#3ddc84"></use><text x="722" y="262" class="th " style="font-size:22px">CHARGING</text><use href="#i-ok" x="910" y="228" width="44" height="44" style="color:#3ddc84" filter="url(#glow)"></use><path d="M270,282 V330" class="tr" stroke="#ff9f1a" stroke-width="3" marker-end="url(#ar-warn)"></path><rect x="80" y="334" width="560" height="64" rx="10" fill="url(#hatchRed)" stroke="#ff9f1a" stroke-width="2.5" class="pulse" filter="url(#glow)"></rect><rect x="80" y="334" width="560" height="64" rx="10" fill="#06100b" opacity="0.55"></rect><text x="102" y="375" class="th " style="font-size:20px;fill:#e9f0e6">USB CONNECTION / DATA-ROLE STATE</text><use href="#i-warn" x="590" y="346" width="40" height="40" style="color:#ff9f1a"></use><text x="170" y="432" class="th " style="font-size:30px;fill:#ff4f4f" filter="url(#glow)">STUCK?</text><text x="292" y="418" class="t ts c-dim">Hypothesis: PD controller (via EC) never</text><text x="292" y="434" class="t ts c-dim">reported a USB connection to the host</text><path d="M150,398 V454" class="tr" stroke="#ff4f4f" stroke-width="2.5" marker-end="url(#ar-fail)" stroke-dasharray="6 5"></path><path d="M620,398 V454" class="tr" stroke="#ff4f4f" stroke-width="2.5" marker-end="url(#ar-fail)" stroke-dasharray="6 5"></path><rect x="80" y="458" width="380" height="64" rx="10" fill="#06100b" stroke="#56645c" stroke-width="2.5" stroke-dasharray="6 5"></rect><rect x="80" y="458" width="380" height="64" rx="10" fill="#06100b" opacity="0"></rect><text x="102" y="499" class="th " style="font-size:18px;fill:#7f8f86">USB 2.0 ENUMERATION</text><use href="#i-q" x="410" y="470" width="40" height="40" style="color:#56645c"></use><rect x="480" y="458" width="330" height="64" rx="10" fill="#06100b" stroke="#56645c" stroke-width="2.5" stroke-dasharray="6 5"></rect><rect x="480" y="458" width="330" height="64" rx="10" fill="#06100b" opacity="0"></rect><text x="502" y="499" class="th " style="font-size:18px;fill:#7f8f86">ALT MODE · MUX · DP</text><use href="#i-q" x="760" y="470" width="40" height="40" style="color:#56645c"></use><text x="90" y="540" class="t ts c-fail">needs no Alt Mode, no mux — still absent</text><text x="490" y="540" class="t ts c-fail">never reached</text><path d="M300,522 C300,600 560,600 646,600" class="tr" stroke="#ff4f4f" stroke-width="2.5" marker-end="url(#ar-fail)"></path><path d="M810,490 C840,490 850,600 860,610" class="tr" stroke="#ff4f4f" stroke-width="2.5" marker-end="url(#ar-fail)"></path><rect x="650" y="568" width="250" height="64" rx="32" fill="#06100b" stroke="#ff4f4f" stroke-width="2.5"></rect><use href="#i-usb" x="670" y="584" width="32" height="32" style="color:#d5e1d8"></use><text x="712" y="610" class="th " style="font-size:20px">USB · LAN</text><use href="#i-x" x="846" y="580" width="40" height="40" style="color:#ff4f4f" filter="url(#glow)"></use><rect x="910" y="568" width="250" height="64" rx="32" fill="#06100b" stroke="#ff4f4f" stroke-width="2.5"></rect><use href="#i-mon" x="930" y="584" width="32" height="32" style="color:#d5e1d8"></use><text x="972" y="610" class="th " style="font-size:20px">DISPLAYS</text><use href="#i-x" x="1106" y="580" width="40" height="40" style="color:#ff4f4f" filter="url(#glow)"></use><g transform="translate(1000,110)"><rect width="170" height="420" rx="8" fill="#0b1712" stroke="#24402f"></rect><text x="14" y="28" class="t ts" style="fill:#cfdcd2"><tspan x="14" dy="0">THE REASONING</tspan><tspan x="14" dy="17"></tspan><tspan x="14" dy="17">If only Alt Mode</tspan><tspan x="14" dy="17">had failed, USB 2.0</tspan><tspan x="14" dy="17">would normally still</tspan><tspan x="14" dy="17">work and a compliant</tspan><tspan x="14" dy="17">dock would show a</tspan><tspan x="14" dy="17">Billboard device.</tspan><tspan x="14" dy="17"></tspan><tspan x="14" dy="17">Nothing showed up,</tspan><tspan x="14" dy="17">which points to a</tspan><tspan x="14" dy="17">stuck state upstream</tspan><tspan x="14" dy="17">of both paths.</tspan><tspan x="14" dy="17"></tspan><tspan x="14" dy="17">Inference, not proof.</tspan></text></g><rect x="40" y="670" width="1130" height="250" rx="10" fill="#08130e" stroke="#24402f"></rect><text x="60" y="698" class="t ts tw c-aux">EVIDENCE · WINDOWS DEVICE MANAGER (View → Devices by connection)</text><rect x="60" y="714" width="520" height="186" rx="6" fill="#0f1513" stroke="#3a4a42" stroke-width="1.5"></rect><rect x="60" y="714" width="520" height="28" rx="6" fill="#16201b"></rect><text x="74" y="733" class="t ts tw" style="fill:#d5e1d8">IF ONLY ALT MODE / LANES HAD FAILED (expected)</text><text x="80" y="766" class="t ts" style="fill:#cfdcd2">▸ USB xHCI controller → Type-C port</text><text x="98" y="788" class="t ts" style="fill:#cfdcd2">└ Generic USB hub (dock, USB 2.0 side)</text><text x="116" y="810" class="t ts" style="fill:#f2c230">└ USB Billboard device  ← “display connection may be limited”</text><text x="116" y="832" class="t ts" style="fill:#cfdcd2">└ Dock USB 2.0 devices (management, audio …)</text><text x="80" y="854" class="t ts" style="fill:#cfdcd2">▸ USB Connector Managers → UCM-UCSI ACPI device</text><text x="80" y="876" class="t ts" style="fill:#97ad9f">▸ no DisplayPort monitors · no USB 3 hub</text><rect x="630" y="714" width="520" height="186" rx="6" fill="#0f1513" stroke="#ff4f4f" stroke-width="1.5"></rect><rect x="630" y="714" width="520" height="28" rx="6" fill="#16201b"></rect><text x="644" y="733" class="t ts tw" style="fill:#ff4f4f">OBSERVED IN THIS INCIDENT (as reported)</text><text x="650" y="766" class="t ts" style="fill:#cfdcd2">▸ USB xHCI controller → Type-C port</text><text x="668" y="788" class="t ts" style="fill:#ff4f4f">└ (dock not detected — no hub, no Billboard,</text><text x="668" y="810" class="t ts" style="fill:#ff4f4f">└  no Ethernet, no audio device listed)</text><text x="650" y="832" class="t ts" style="fill:#3ddc84">▸ Charging indicator: ON</text><text x="650" y="854" class="t ts" style="fill:#f2c230">▸ → suggests the break was before USB 2.0</text></svg>