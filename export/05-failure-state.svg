<svg width="1200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" class="fig-svg " role="img" aria-label="Hypothesis: charging worked, USB connection state likely stuck before any USB enumeration, dock absent from Device Manager"><style>@import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap');
