</defs><rect width="100%" height="100%" fill="#06100b"/><text x="40" y="44" class="th txl">RESET DEPTH · WHAT EACH ONE ACTUALLY CLEARS</text><text x="40" y="64" class="t ts c-dim">Not interchangeable: deeper power resets clear more volatile state; a CMOS reset clears configuration, not stuck controllers</text><text x="566" y="112" class="t ts tw c-dim" text-anchor="middle"><tspan x="566" dy="0">OS / DRIVERS</tspan></text><text x="658" y="112" class="t ts tw c-dim" text-anchor="middle"><tspan x="658" dy="0">CPU / SoC</tspan></text><text x="750" y="112" class="t ts tw c-dim" text-anchor="middle"><tspan x="750" dy="0">MAIN RAILS</tspan></text><text x="842" y="112" class="t ts tw c-dim" text-anchor="middle"><tspan x="842" dy="0">PD</tspan><tspan x="842" dy="12">MUX STATE</tspan></text><text x="934" y="112" class="t ts tw c-dim" text-anchor="middle"><tspan x="934" dy="0">EC</tspan></text><text x="1026" y="112" class="t ts tw c-dim" text-anchor="middle"><tspan x="1026" dy="0">BATTERY PATH</tspan></text><text x="1118" y="112" class="t ts tw c-dim" text-anchor="middle"><tspan x="1118" dy="0">BIOS SETTINGS</tspan><tspan x="1118" dy="12">CLOCK</tspan></text><rect x="30" y="140" width="1140" height="74" rx="8" fill="#16362a" opacity=".55" stroke="#2c5541"></rect><text x="50" y="166" class="t ts tw" style="fill:#f2c230">LEVEL 1</text><text x="50" y="190" class="th " style="font-size:17px">WINDOWS RESTART</text><text x="50" y="206" class="t ts c-dim">warm reset, OS-driven</text><circle cx="566" cy="177" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="658" cy="177" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="750" cy="177" r="12" fill="none" stroke="#6c7c74" stroke-width="2.5"></circle><circle cx="842" cy="177" r="12" fill="none" stroke="#6c7c74" stroke-width="2.5"></circle><circle cx="934" cy="177" r="12" fill="none" stroke="#6c7c74" stroke-width="2.5"></circle><circle cx="1026" cy="177" r="12" fill="none" stroke="#6c7c74" stroke-width="2.5"></circle><circle cx="1118" cy="177" r="12" fill="none" stroke="#6c7c74" stroke-width="2.5"></circle><rect x="48" y="226" width="1122" height="74" rx="8" fill="#1a4232" opacity=".55" stroke="#2c5541"></rect><text x="68" y="252" class="t ts tw" style="fill:#f2c230">LEVEL 2</text><text x="68" y="276" class="th " style="font-size:17px">FORCED SHUTDOWN</text><text x="68" y="292" class="t ts c-dim">hold &gt; 4 s · ACPI override → S5</text><circle cx="566" cy="263" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="658" cy="263" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="750" cy="263" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="842" cy="263" r="13" fill="none" stroke="#ff9f1a" stroke-width="2.5"></circle><path d="M842,250 A13,13 0 0 1 842,276Z" fill="#ff9f1a"></path><circle cx="934" cy="263" r="12" fill="none" stroke="#6c7c74" stroke-width="2.5"></circle><circle cx="1026" cy="263" r="12" fill="none" stroke="#6c7c74" stroke-width="2.5"></circle><circle cx="1118" cy="263" r="12" fill="none" stroke="#6c7c74" stroke-width="2.5"></circle><rect x="66" y="312" width="1104" height="74" rx="8" fill="#1f4f3b" opacity=".55" stroke="#2c5541"></rect><text x="86" y="338" class="t ts tw" style="fill:#f2c230">LEVEL 3</text><text x="86" y="362" class="th " style="font-size:17px">RESIDUAL / HARDWARE POWER RESET</text><text x="86" y="378" class="t ts c-dim">AC + dock out, hold ≈ 15–20 s</text><circle cx="566" cy="349" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="658" cy="349" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="750" cy="349" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="842" cy="349" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="934" cy="349" r="13" fill="none" stroke="#ff9f1a" stroke-width="2.5"></circle><path d="M934,336 A13,13 0 0 1 934,362Z" fill="#ff9f1a"></path><circle cx="1026" cy="349" r="12" fill="none" stroke="#6c7c74" stroke-width="2.5"></circle><circle cx="1118" cy="349" r="12" fill="none" stroke="#6c7c74" stroke-width="2.5"></circle><rect x="84" y="398" width="1086" height="74" rx="8" fill="#245d45" opacity=".55" stroke="#2c5541"></rect><text x="104" y="424" class="t ts tw" style="fill:#f2c230">LEVEL 4</text><text x="104" y="448" class="th " style="font-size:17px">EC / BATTERY DISCONNECT RESET</text><text x="104" y="464" class="t ts c-dim">pinhole · BIOS battery-disable</text><circle cx="566" cy="435" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="658" cy="435" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="750" cy="435" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="842" cy="435" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="934" cy="435" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="1026" cy="435" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="1118" cy="435" r="13" fill="none" stroke="#ff9f1a" stroke-width="2.5"></circle><path d="M1118,422 A13,13 0 0 1 1118,448Z" fill="#ff9f1a"></path><rect x="30" y="484" width="1140" height="74" rx="8" fill="#3a2f55" opacity=".55" stroke="#b07cff" stroke-dasharray="6 5"></rect><text x="50" y="510" class="t ts tw" style="fill:#b07cff">LEVEL 5</text><text x="50" y="534" class="th " style="font-size:17px">RTC / CMOS / NVRAM RESET</text><text x="50" y="550" class="t ts c-dim">configuration reset — a different axis</text><text x="566" y="526" class="t mid c-mute">—</text><text x="658" y="526" class="t mid c-mute">—</text><text x="750" y="526" class="t mid c-mute">—</text><text x="842" y="526" class="t mid c-mute">—</text><text x="934" y="526" class="t mid c-mute">—</text><text x="1026" y="526" class="t mid c-mute">—</text><circle cx="1118" cy="521" r="13" fill="#3ddc84" filter="url(#glow)"></circle><circle cx="60" cy="590" r="9" fill="#3ddc84"></circle><text x="76" y="594" class="t ts">cleared / re-initialised</text><circle cx="290" cy="590" r="9" fill="none" stroke="#ff9f1a" stroke-width="2"></circle><path d="M290,581 A9,9 0 0 1 290,599Z" fill="#ff9f1a"></path><text x="306" y="594" class="t ts">platform-dependent (rail wiring, dock VBUS, sealed battery)</text><circle cx="760" cy="590" r="8" fill="none" stroke="#6c7c74" stroke-width="2"></circle><text x="776" y="594" class="t ts">survives</text><text x="40" y="622" class="t ts tw c-aux">This incident: Level 1 did not fix it, a long hold (Level 2–3) did → suggests the state lived in a domain a restart never powers down.</text></svg>